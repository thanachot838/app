<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วงล้อสุ่มเลข 1-164</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--line:#d9d6cc;--acc:#d6336c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f1f0ea;--card:#222227;--line:#3a3a42;--acc:#ff6b9a}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#f1f0ea;--card:#222227;--line:#3a3a42;--acc:#ff6b9a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
h1{font-size:1.3rem;margin:4px 0 0}
.wrap{position:relative;width:min(92vw,560px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.ptr{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--acc);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));z-index:2}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;background:var(--card);border:4px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,6vw,2.2rem);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 28px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:10px 16px}
button:disabled{opacity:.5;cursor:default}
input[type=number]{width:80px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
label{display:flex;align-items:center;gap:6px}
.result{font-size:clamp(3rem,16vw,6rem);font-weight:800;color:var(--acc);line-height:1;min-height:1em}
.hist{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.95rem}
.hist b{display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
</style>
</head>
<body>
<h1>🎡 วงล้อสุ่มเลข</h1>
<div class="row">
  <label>จาก <input type="number" id="min" value="1"></label>
  <label>ถึง <input type="number" id="max" value="164"></label>
  <label><input type="checkbox" id="norep" checked> ไม่สุ่มซ้ำ</label>
  <button class="sec" id="shuffle">🔀 สลับเลข</button>
  <button class="sec" id="reset">รีเซ็ต</button>
</div>
<div class="wrap"><div class="ptr"></div><canvas id="c"></canvas><div class="hub" id="hub">?</div></div>
<button id="spin">หมุน!</button>
<div class="result" id="res"></div>
<div class="hist"><b>เลขที่ออกแล้ว (<span id="cnt">0</span>) · เหลือ <span id="left">164</span></b><div class="chips" id="hist"></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let pool=[],hist=[],rot=0,spinning=false,S=560;
function build(){
  let a=parseInt($('min').value),b=parseInt($('max').value);
  if(isNaN(a)||isNaN(b)||a>b){a=1;b=164;}
  pool=[];for(let i=a;i<=b;i++)pool.push(i);
  hist=[];rot=0;$('res').textContent='';$('hub').textContent='?';
  render();
}
function size(){
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  S=r.width;cv.width=S*d;cv.height=S*d;ctx.setTransform(d,0,0,d,0,0);draw();
}
function draw(){
  const n=pool.length,R=S/2-4,cx=S/2,cy=S/2;
  ctx.clearRect(0,0,S,S);
  if(!n){ctx.fillStyle='#888';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('หมดแล้ว',cx,cy);return;}
  const step=2*Math.PI/n;
  for(let i=0;i<n;i++){
    const a0=rot+i*step,a1=a0+step;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
    ctx.fillStyle=`hsl(${(i*47)%360},65%,${i%2?48:56}%)`;ctx.fill();
  }
  const fs=Math.max(6,Math.min(26,R*step*0.62));
  ctx.fillStyle='#fff';ctx.font=`700 ${fs}px sans-serif`;ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=2;
  for(let i=0;i<n;i++){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rot+(i+.5)*step);
    ctx.fillText(pool[i],R-6,0);ctx.restore();
  }
  ctx.shadowBlur=0;
}
function under(){
  const n=pool.length;if(!n)return -1;
  const step=2*Math.PI/n,t=((-Math.PI/2-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  return Math.min(n-1,Math.floor(t/step));
}
function render(){
  $('cnt').textContent=hist.length;$('left').textContent=pool.length;
  $('hist').innerHTML=hist.map(h=>`<span>${h}</span>`).join('');
  draw();
}
function spin(){
  if(spinning||!pool.length)return;
  spinning=true;$('spin').disabled=true;$('res').textContent='';
  const n=pool.length,step=2*Math.PI/n,i=Math.floor(Math.random()*n);
  const jitter=(Math.random()-.5)*step*.7;
  const base=-Math.PI/2-(i+.5)*step+jitter;
  const start=rot,twoPi=2*Math.PI;
  const delta=(((base-start)%twoPi)+twoPi)%twoPi+(6+Math.floor(Math.random()*3))*twoPi;
  const dur=5500,t0=performance.now();
  (function f(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
    rot=start+delta*e;draw();
    const u=under();if(u>=0)$('hub').textContent=pool[u];
    if(p<1)return requestAnimationFrame(f);
    const val=pool[i];$('hub').textContent=val;$('res').textContent=val;
    hist.push(val);
    if($('norep').checked)pool.splice(i,1);
    spinning=false;$('spin').disabled=false;render();
  })(t0);
}
function shuffle(){
  if(spinning||!pool.length)return;
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  render();
}
$('shuffle').onclick=shuffle;
$('spin').onclick=spin;
$('reset').onclick=()=>{if(!spinning)build();};
$('min').onchange=$('max').onchange=()=>{if(!spinning)build();};
window.addEventListener('resize',size);
build();size();
</script>
</body>
</html>
